name: Fork - Publish GHCR

on:
    push:
        branches: [codex/shaonan-fulltext]
        paths:
            - '.github/workflows/fork-ghcr.yml'
            - 'Dockerfile'
            - '.dockerignore'
            - 'lib/**'
            - 'scripts/**'
            - 'patches/**'
            - 'assets/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'tsconfig.json'
            - 'tsdown*.ts'
            - 'vitest*.ts'
    workflow_dispatch:
    workflow_call:
        inputs:
            ref:
                description: Exact commit to build after upstream synchronization
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: fork-ghcr-publish
    cancel-in-progress: false

env:
    IMAGE: ghcr.io/vizmoe/rsshub
    CUSTOM_BRANCH: codex/shaonan-fulltext

jobs:
    prepare:
        if: github.repository == 'vizmoe/RSSHub'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            sha: ${{ steps.commit.outputs.sha }}
            short-sha: ${{ steps.commit.outputs.short-sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref || github.sha }}
                  persist-credentials: false
            - name: Resolve the build commit
              id: commit
              run: |
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  echo "short-sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

    verify:
        needs: prepare
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379/tcp
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.prepare.outputs.sha }}
                  persist-credentials: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build route registry
              run: pnpm build:routes
            - name: Typecheck
              run: pnpm typecheck
            - name: Test fork integrations and feed infrastructure
              env:
                  REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}/
              run: >-
                  pnpm run vitest
                  lib/utils/bilibili-article.test.ts
                  lib/utils/bilibili-opus.test.ts
                  lib/utils/substack.test.ts
                  lib/utils/readable-social.test.ts
                  lib/utils/xai-news.test.ts
                  lib/utils/rss-parser.test.ts
                  lib/utils/parse-date.test.ts
                  lib/utils/cache/index.test.ts
                  lib/registry.test.ts
                  lib/config.test.ts

    build:
        needs: [prepare, verify]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                      arch: amd64
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
                      arch: arm64
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.prepare.outputs.sha }}
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  tags: ${{ env.IMAGE }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/vizmoe/RSSHub
                      org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
                  cache-from: type=gha,scope=fork-ghcr-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=fork-ghcr-${{ matrix.arch }}
                  outputs: type=image,push-by-digest=true,name-canonical=true,push=true

            - name: Smoke test the published image
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  trap 'docker logs rsshub-smoke; docker rm -f rsshub-smoke' EXIT
                  docker run --detach --name rsshub-smoke --publish 127.0.0.1:1200:1200 "$IMAGE@$DIGEST"
                  curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 3 http://127.0.0.1:1200/healthz
                  curl --fail --silent --show-error http://127.0.0.1:1200/ > /dev/null

            - name: Export the verified digest
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  mkdir -p "$RUNNER_TEMP/digests"
                  touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: fork-digest-${{ matrix.arch }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    publish:
        needs: [prepare, build]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: fork-digest-*
                  path: ${{ runner.temp }}/digests
                  merge-multiple: true

            - name: Check whether this is still the latest custom branch commit
              id: latest
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BUILD_SHA: ${{ needs.prepare.outputs.sha }}
              run: |
                  current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CUSTOM_BRANCH" --jq .object.sha)
                  if [ "$BUILD_SHA" = "$current_sha" ]; then
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Prepare image tags
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}
                  flavor: latest=false
                  tags: |
                      type=raw,value=sha-${{ needs.prepare.outputs.short-sha }}
                      type=raw,value=latest,enable=${{ steps.latest.outputs.publish }}
                      type=raw,value={{date 'YYYY-MM-DD'}},enable=${{ steps.latest.outputs.publish }}

            - name: Publish the multi-platform manifest
              working-directory: ${{ runner.temp }}/digests
              env:
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                  set -euo pipefail
                  tags=()
                  while IFS= read -r tag; do
                      tags+=(--tag "$tag")
                  done <<< "$TAGS"
                  sources=()
                  for digest in *; do
                      sources+=("$IMAGE@sha256:$digest")
                  done
                  docker buildx imagetools create "${tags[@]}" "${sources[@]}"
                  docker buildx imagetools inspect "${TAGS%%$'\n'*}"
                  {
                      echo '### Published image tags'
                      echo '```text'
                      echo "$TAGS"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
