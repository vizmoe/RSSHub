name: Fork - Sync Upstream

on:
    schedule:
        - cron: '23 * * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: fork-sync-upstream
    cancel-in-progress: false

jobs:
    sync:
        if: github.repository == 'vizmoe/RSSHub' && github.ref_name == github.event.repository.default_branch
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        outputs:
            changed: ${{ steps.sync.outputs.changed }}
            sha: ${{ steps.sync.outputs.sha }}
        steps:
            - name: Sync master and merge it into the custom branch
              id: sync
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const { owner, repo } = context.repo;
                      const upstreamBranch = 'master';
                      const customBranch = 'codex/shaonan-fulltext';
                      try {
                          await github.rest.repos.mergeUpstream({ owner, repo, branch: upstreamBranch });
                      } catch (error) {
                          if (error.status === 409) {
                              core.setFailed('master conflicts with DIYgod/RSSHub master. Resolve this conflict and rerun the workflow. No force synchronization was attempted.');
                              return;
                          }
                          throw error;
                      }
                      const upstream = await github.rest.repos.getBranch({ owner, repo, branch: upstreamBranch });
                      const before = await github.rest.repos.getBranch({ owner, repo, branch: customBranch });
                      try {
                          await github.rest.repos.merge({
                              owner,
                              repo,
                              base: customBranch,
                              head: upstream.data.commit.sha,
                              commit_message: `Merge upstream master into ${customBranch}`,
                          });
                      } catch (error) {
                          if (error.status === 409) {
                              core.setFailed(`master is synchronized, but upstream changes conflict with ${customBranch}. Merge master into ${customBranch}, resolve the conflicts, and rerun this workflow. The custom branch was not overwritten.`);
                              return;
                          }
                          throw error;
                      }
                      const after = await github.rest.repos.getBranch({ owner, repo, branch: customBranch });
                      const changed = before.data.commit.sha !== after.data.commit.sha;
                      core.setOutput('changed', String(changed));
                      core.setOutput('sha', after.data.commit.sha);
                      await core.summary
                          .addHeading('Upstream synchronization')
                          .addRaw(`master is synchronized with DIYgod/RSSHub. ${changed ? `Merged updates into ${customBranch}.` : `${customBranch} already contains these updates.`}`)
                          .addBreak()
                          .addCodeBlock(after.data.commit.sha)
                          .write();

    # GITHUB_TOKEN updates do not trigger push workflows, so call the publisher directly.
    publish:
        needs: sync
        if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        permissions:
            contents: read
            packages: write
        uses: vizmoe/RSSHub/.github/workflows/fork-ghcr.yml@codex/shaonan-fulltext
        with:
            ref: ${{ needs.sync.outputs.sha }}
